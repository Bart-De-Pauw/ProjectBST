services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bowling
      POSTGRES_PASSWORD: bowling
      POSTGRES_DB: bowling
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ../api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://bowling:bowling@db:5432/bowling?sslmode=disable
    depends_on:
      - db
    ports:
      - "8080:8080"

  web:
    build:
      context: ../web
    environment:
      VITE_DEV_API_PROXY: http://api:8080
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules

volumes:
  db_data:
  web_node_modules:

