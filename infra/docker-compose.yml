# Raspberry Pi / server LAN deployment — Postgres not exposed on host ports by default.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bowling
      POSTGRES_PASSWORD: bowling
      POSTGRES_DB: bowling
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    restart: unless-stopped

  api:
    build:
      context: ../api
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
        APP_ENV: prod
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://bowling:bowling@db:5432/bowling?sslmode=disable
    depends_on:
      - db
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: Dockerfile.prod
      args:
        VITE_GIT_COMMIT: ${GIT_COMMIT:-unknown}
        VITE_BUILD_TIME: ${BUILD_TIME:-}
        VITE_APP_ENV: prod
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  db_data:
